services: 
  practiseproj: 
    image: "sridhar2310/practiseproj:v1"
    container_name: first_practise_project
    ports: 
      - "8080:8080"
    environment: 
      - SPRING_PROFILES_ACTIVE=docker
    deploy: 
      resources: 
        limits: 
          memory: 700m
    networks: 
      - practise_project
networks: 
  practise_project: 
    driver: "bridge"